<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261125c">
<style>
body { background: #f6f7f9; }
.login { max-width: 380px; margin: 14vh auto 0; padding: 0 20px; } .login .box { padding: 28px; } .login h1 { font-size: 21px; margin-bottom: 4px; } .login p { color: var(--ink3); font-size: 14px; margin-bottom: 18px; }
.ahd { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; } .ahd .wrap { max-width: 1400px; display: flex; align-items: center; gap: 22px; height: 58px; }
.ahd b { font-size: 16px; white-space: nowrap; } #tabs { display: flex; gap: 4px; overflow-x: auto; } #tabs button { height: 36px; padding: 0 14px; border-radius: 8px; font-weight: 600; color: var(--ink2); white-space: nowrap; } #tabs button.on { background: var(--ink); color: #fff; }
.amain { max-width: 1400px; margin: 0 auto; padding: 22px 20px 90px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; } .kpis div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; } .kpis small { color: var(--ink3); font-size: 13px; } .kpis b { display: block; font-size: 26px; font-weight: 800; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; } .bar select, .bar input { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #fff; } .bar input { min-width: 200px; flex: 1; max-width: 300px; }
.cnt { color: var(--ink2); font-size: 13.5px; margin-bottom: 8px; }
.tw { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; } table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
th { text-align: left; background: #fafbfc; color: var(--ink3); font-weight: 600; font-size: 12.5px; padding: 11px 12px; border-bottom: 1px solid var(--line); } td { padding: 10px 12px; border-bottom: 1px solid var(--line2); } tr:last-child td { border-bottom: 0; }
td.memo { white-space: normal; min-width: 160px; max-width: 260px; color: var(--ink2); }
.stsel { height: 30px; border-radius: 999px; border: 0; padding: 0 10px; font-weight: 700; font-size: 12.5px; } .stsel.s1 { background: #eaf1ff; color: #1d4fd8; } .stsel.s2 { background: #e6f6ee; color: #0b7a44; } .stsel.s3 { background: #fff3da; color: #9a6400; } .stsel.s4 { background: #f1f2f5; color: #8b8f98; }
.del { color: var(--warn); font-size: 13px; font-weight: 600; padding: 4px 6px; }
.it { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.it .g { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } .it label { font-size: 12.5px; font-weight: 600; color: var(--ink2); display: block; } .it label small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.it input:not([type=checkbox]), .it select, .it textarea { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; margin-top: 5px; background: #fff; font-size: 14.5px; font-weight: 400; color: var(--ink); } .it textarea { height: auto; min-height: 76px; padding: 10px; resize: vertical; }
.it .w2 { grid-column: span 2; } .it .w4 { grid-column: 1 / -1; }
.ops { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 12px; } .ops .ck { display: flex; gap: 6px; align-items: center; font-size: 13.5px; } .ops .ck input { width: 17px; height: 17px; accent-color: var(--ink); } .ops .cnt { margin: 0 0 0 auto; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: center; z-index: 30; } .savebar .btn { min-width: 220px; }
.demo { background: #fff8e6; border: 1px solid #f3dfa8; color: #7a5a00; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 14px; }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .it .g { grid-template-columns: 1fr 1fr; } .it .w2 { grid-column: 1 / -1; } .ahd .wrap { gap: 10px; } #a-name { display: none; } }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="box" id="lf"><h1>관리자 로그인</h1><p>처음 비밀번호는 0000 입니다. 로그인 후 기본 설정에서 바꿔 주세요.</p>
    <div class="f"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <p id="lerr" style="color:var(--warn);min-height:20px;font-size:14px;margin:0"></p><button class="btn dark full" type="submit">로그인</button></form>
</div>
<div id="adm" hidden>
  <header class="ahd"><div class="wrap"><b id="a-name">관리자</b><nav id="tabs"><button data-t="apps">신청 내역</button><button data-t="users">회원</button><button data-t="items">이용권 관리</button><button data-t="site">기본 설정</button></nav>
    <span style="margin-left:auto;display:flex;gap:8px"><a class="pill" href="index.html" target="_blank">사이트 보기</a><button class="pill" id="logout">로그아웃</button></span></div></header>
  <main class="amain"><div class="demo">시안 단계 안내: 지금은 회원·신청 내역·설정이 <b>이 브라우저에만</b> 저장됩니다. Cloudflare 서버를 연결하면 모든 입주민의 가입·신청이 여기에 모입니다.</div><div id="view"></div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/data.js?v=20261125c"></script>
<script src="js/store.js?v=20261125c"></script>
<script src="js/admin.js?v=20261125c"></script>
</body>
</html>
